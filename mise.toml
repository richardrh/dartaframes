[tools]
dart = "3.13.0"
python = "3.12"
rust = { version = "1.98.0", profile = "minimal", components = ["rustfmt", "llvm-tools-preview"] }

[tasks.setup]
description = "Resolve the locked Dart dependencies"
run = "dart pub get --enforce-lockfile"

[tasks.check]
description = "Run checks that do not compile the native library"
depends = ["setup"]
run = """
dart format --output=none --set-exit-if-changed .
dart analyze --fatal-infos
dart test
python3 -m unittest discover -s tool -p "test_native_*.py"
cargo fmt --all -- --check
"""

[tasks."native:build"]
description = "Build the local debug native library (large first build)"
depends = ["setup"]
run = "cargo build --locked --package dartaframes_polars_ffi"
